# 正式环境 Nginx：静态前端 + /api 同源反代（含 SSE 流式支持）
server {
    listen 80;
    server_name _;

    # 部署包上传上限与后端 multipart 配置对齐（2GB）
    client_max_body_size 2200m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 前端路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API（含 SSE 流式部署日志：关闭缓冲、长超时）
    # 用 resolver + 变量让 nginx 在请求时解析 backend 主机名（而非启动时），
    # 避免 backend 容器重启期间 DNS 失联导致 nginx 启动失败（host not found in upstream）
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
